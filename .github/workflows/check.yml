name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # OpenChamber installs from git without building, so the committed
      # bundles must be exactly what the sources build to.
      - run: bun run build
      - name: Committed bundles match the sources
        run: |
          git diff --exit-code -- panel/main.js status/main.js \
            || { echo "::error::Run 'bun run build' and commit panel/main.js and status/main.js."; exit 1; }
      - run: bun run check
